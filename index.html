        body {

            padding: 40px 20px;
            margin: 0;
        }
        .wrapper {
            max-width: 850px;
            margin: 0 auto;
            background: #1a1a22;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2a35;
            position: relative;
        }
        h1 {
            color: #ff3366;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            font-size: 26px;
        }
        .subtitle {
            color: #aaa;
            font-size: 13px;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* BARRE DE NAVIGATION (MENU) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 15px;
        }
        .tab-btn {
            background: #0d0d12;
            color: #888899;
            border: 1px solid #2a2a35;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: #fff;
            border-color: #ff3366;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ff3366, #ff66cc);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .full-width {
            grid-column: span 2;
        }
        label {
            font-size: 11px;
            color: #ff3366;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

            background: #0d0d12;

            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

            border-color: #ff3366;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.2);
        }
